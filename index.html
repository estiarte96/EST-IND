<!DOCTYPE html>
<html>

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KNNRQ7V0GR"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-KNNRQ7V0GR');

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>EST Ingenieros</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400">
    <link rel="stylesheet" href="font-awesome-4.5.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="slick/slick.css">
    <link rel="stylesheet" type="text/css" href="slick/slick-theme.css">
    <link rel="stylesheet" href="css/tooplate-style.css">

    <meta name="description" content="EST Ingenieros - Especialistas en reconstrucción de accidentes y peritajes técnicos.">
    <meta name="author" content="EST Ingenieros">
    <meta name="keywords" content="peritajes, reconstrucción de accidentes, ingeniería forense, análisis técnico">

    <!-- Open Graph (WhatsApp, Instagram, Facebook) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="EST Ingenieros - Peritajes Técnicos">
    <meta property="og:description" content="Especialistas en reconstrucción de accidentes y análisis pericial.">
    <meta property="og:image" content="https://estiarte96.github.io/EST-IND/img/bg-logo.webp">
    <meta property="og:url" content="https://estiarte96.github.io/EST-IND/index">
    <meta property="og:site_name" content="EST Ingenieros">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="EST Ingenieros - Peritajes Técnicos">
    <meta name="twitter:description" content="Servicios especializados en reconstrucción de accidentes y análisis pericial.">
    <meta name="twitter:image" content="https://estiarte96.github.io/EST-IND/img/bg-logo.webp">

    <script>
        var renderPage = true;
        if (navigator.userAgent.indexOf('MSIE') !== -1 || navigator.appVersion.indexOf('Trident/') > 0) {
            alert("Please view this in a modern browser such as Chrome or Microsoft Edge.");
            renderPage = false;
        }
    </script>

</head>

<body>
    <div id="loader-wrapper">
        <div id="loader"></div>
        <div class="loader-section section-left"></div>
        <div class="loader-section section-right"></div>
    </div>

    <div class="container">
        <header id="header" class="text-center tm-text-gray">
            <img src="img/bg-logo.webp" alt="Logo" style="max-width: 35%; height: auto;">
        </header>

        <nav class="navbar navbar-expand-lg navbar-light">
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="#top">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#tm-section-2">Info</a></li>
                    <li class="nav-item"><a class="nav-link" href="#tm-section-6">Contacto</a></li>
                </ul>
            </div>
        </nav>

        <section class="row" id="tm-section-1">
            <div class="col-lg-12 tm-slider-col">
                <div class="tm-img-slider">
                    <div class="tm-img-slider-item">
                        <p class="tm-slider-caption">Análisis preciso, decisiones seguras.</p>
                        <picture>
                            <source srcset="img/1-600.webp 600w, img/1-1200.webp 1200w, img/1-1920.webp 1920w" type="image/webp">
                            <img src="img/1.webp" alt="Análisis preciso" class="tm-slider-img" loading="lazy">
                        </picture>
                    </div>
                </div>
            </div>
        </section>

        <div class="row">
            <div class="col-md-6">
                <picture>
                    <source srcset="img/3D-600.webp 600w, img/3D-1200.webp 1200w" type="image/webp">
                    <img src="img/3D.webp" class="img-fluid" alt="Análisis 3D de accidentes" loading="lazy">
                </picture>
            </div>
            <div class="col-md-6">
                <picture>
                    <source srcset="img/Confianza-600.webp 600w, img/Confianza-1200.webp 1200w" type="image/webp">
                    <img src="img/Confianza.webp" class="img-fluid" alt="Confianza en peritajes" loading="lazy">
                </picture>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-4">
                <picture>
                    <source srcset="img/img4-600.webp 600w, img/img4-1200.webp 1200w" type="image/webp">
                    <img src="img/img4.webp" class="img-fluid" alt="3D Analysis" loading="lazy">
                </picture>
            </div>
            <div class="col-lg-8">
                <picture>
                    <source srcset="img/Accidente-600.webp 600w, img/Accidente-1200.webp 1200w" type="image/webp">
                    <img src="img/Accidente.webp" class="img-fluid" alt="Reconstrucción de accidentes" loading="lazy">
                </picture>
            </div>
        </div>

        <footer class="mt-5">
            <p class="text-center">© 2025 EST Ingenieros</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="js/jquery-1.11.3.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="slick/slick.min.js"></script>

    <script>
        function setCarousel() {
            var slider = $('.tm-img-slider');
            if (slider.hasClass('slick-initialized')) {
                slider.slick('destroy');
            }
            slider.slick({
                autoplay: true,
                fade: true,
                speed: 800,
                infinite: true,
                slidesToShow: 1,
                slidesToScroll: 1
            });
        }

        $(document).ready(function () {
            if (renderPage) {
                $('body').addClass('loaded');
            }
            setCarousel();
            $(window).resize(setCarousel);
        });
    </script>

</body>
</html>
